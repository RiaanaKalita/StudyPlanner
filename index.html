<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Planner</title>

<style>
:root{
  --accent: rgba(255,255,255,0.2);
}

body{
  margin:0;
  font-family:"SF Pro Display", sans-serif;
  color:white;
  background-size:cover;
  background-position:center;
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  backdrop-filter:blur(20px);
  background:var(--accent);
  padding:20px;
}
.sidebar div{
  margin:15px 0;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:25px;
  overflow:auto;
}

/* HOME */
.quote{
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:20px;
  margin-bottom:20px;
  font-size:18px;
}

.date{
  font-size:28px;
  margin-bottom:10px;
}

/* CALENDAR */
.calendar{
  backdrop-filter:blur(20px);
  padding:15px;
  border-radius:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  padding:10px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}
.day:hover{
  background:rgba(255,255,255,0.2);
}

/* TASK LIST */
.taskList{
  margin-top:15px;
}

/* BUTTON */
.addBtn{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  font-size:30px;
  cursor:pointer;
  background:white;
  color:black;
}

/* POMODORO */
.timer{
  font-size:80px;
  text-align:center;
  margin-top:100px;
  transition:0.3s;
}
.glow{
  text-shadow:0 0 20px rgba(255,255,255,0.8);
}

/* NOTEBOOK */
.notebook{
  width:150px;
  height:200px;
  border-radius:15px;
  margin:10px;
  display:inline-block;
  padding:10px;
  cursor:pointer;
}

/* EDITOR */
.editor{
  height:80vh;
  background:white;
  color:black;
  padding:20px;
}

/* SETTINGS */
select,input{
  margin:10px 0;
}
</style>
</head>

<body>

<div class="sidebar">
  <div onclick="show('home')">Home</div>
  <div onclick="show('tasks')">Tasks</div>
  <div onclick="show('pomodoro')">Pomodoro</div>
  <div onclick="show('notes')">Notes</div>
  <div onclick="show('settings')">Settings</div>
</div>

<div class="main">

<!-- HOME -->
<div id="home">
  <div class="quote" id="quote"></div>
  <div class="date" id="date"></div>

  <div class="calendar">
    <div id="month"></div>
    <div class="grid" id="calendarGrid"></div>
  </div>

  <div class="taskList" id="dayTasks"></div>
</div>

<!-- TASKS -->
<div id="tasks" style="display:none">
  <h2>Tasks</h2>
  <div id="taskSections"></div>
</div>

<!-- POMODORO -->
<div id="pomodoro" style="display:none">
  <div class="timer glow" id="timer">25:00</div>
  <button onclick="startTimer()">Start</button>

  <h3>Settings</h3>
  Focus <input type="number" id="focus" value="25"><br>
  Short <input type="number" id="short" value="5"><br>
  Long <input type="number" id="long" value="15"><br>

  <input type="file" onchange="uploadPomodoroBg(event)">
</div>

<!-- NOTES -->
<div id="notes" style="display:none">
  <h2>Notebooks</h2>
  <div id="notebooks"></div>
</div>

<!-- SETTINGS -->
<div id="settings" style="display:none">
  <h2>Settings</h2>

  <p>Background Preset</p>
  <select onchange="setBgPreset(this.value)">
    <option value="">Default</option>
    <option value="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">Ocean</option>
    <option value="https://images.unsplash.com/photo-1492724441997-5dc865305da7">Sky</option>
  </select>

  <p>Upload Background</p>
  <input type="file" onchange="uploadBg(event)">

  <p>Accent</p>
  <input type="color" onchange="setAccent(this.value)">
</div>

</div>

<button class="addBtn" id="addBtn" onclick="addTask()">+</button>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");
  document.getElementById(id).style.display="block";

  document.getElementById("addBtn").style.display = id==="tasks" ? "block" : "none";
}

/* QUOTE */
const quotes=[
"you’re doing better than you think 🌸",
"small steps still matter ✨",
"rest is productive too 💗"
];
document.getElementById("quote").innerText=
quotes[Math.floor(Math.random()*quotes.length)];

/* DATE */
let today=new Date();
document.getElementById("date").innerText=
today.toDateString();

/* CALENDAR */
function renderCalendar(){
  let grid=document.getElementById("calendarGrid");
  grid.innerHTML="";
  let days=30;

  for(let i=1;i<=days;i++){
    let d=document.createElement("div");
    d.className="day";
    d.innerText=i;

    d.onclick=()=>showTasksForDay(i);
    grid.appendChild(d);
  }
}
renderCalendar();

/* TASKS */
let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

function addTask(){
  let text=prompt("Task?");
  let date=prompt("Day (1-30)");
  tasks.push({text,date});
  save();
}

function showTasksForDay(day){
  let list=document.getElementById("dayTasks");
  list.innerHTML="<h3>Tasks</h3>";

  tasks.filter(t=>t.date==day).forEach(t=>{
    let div=document.createElement("div");
    div.innerText=t.text;
    list.appendChild(div);
  });
}

/* SAVE */
function save(){
  localStorage.setItem("tasks",JSON.stringify(tasks));
}

/* TIMER */
let time=1500;
function startTimer(){
  setInterval(()=>{
    time--;
    let m=Math.floor(time/60);
    let s=time%60;
    document.getElementById("timer").innerText=
    `${m}:${s<10?"0":""}${s}`;
  },1000);
}

/* BACKGROUNDS */
function uploadBg(e){
  let r=new FileReader();
  r.onload=()=>{
    document.body.style.backgroundImage=`url(${r.result})`;
    localStorage.setItem("bg",r.result);
  };
  r.readAsDataURL(e.target.files[0]);
}

function setBgPreset(url){
  document.body.style.backgroundImage=`url(${url})`;
  localStorage.setItem("bg",url);
}

function uploadPomodoroBg(e){
  let r=new FileReader();
  r.onload=()=>{
    document.getElementById("pomodoro").style.backgroundImage=`url(${r.result})`;
  };
  r.readAsDataURL(e.target.files[0]);
}

/* ACCENT */
function setAccent(c){
  document.documentElement.style.setProperty("--accent",hexToRGBA(c,0.25));
}
function hexToRGBA(hex,a){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* LOAD */
window.onload=()=>{
  let bg=localStorage.getItem("bg");
  if(bg) document.body.style.backgroundImage=`url(${bg})`;
};

</script>

</body>
</html>
