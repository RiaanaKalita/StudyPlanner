<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Planner</title>

<style>
:root{
  --accent: rgba(255,255,255,0.15);
}

body{
  margin:0;
  font-family:"SF Pro Display", sans-serif;
  color:white;
  background-size:cover;
  background-position:center;
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  backdrop-filter:blur(25px);
  background:var(--accent);
  padding:20px;
}
.sidebar div{
  margin:15px 0;
  cursor:pointer;
  transition:0.2s;
}
.sidebar div:hover{
  transform:translateX(5px);
}

/* MAIN */
.main{
  flex:1;
  padding:25px;
  overflow:auto;
}

/* QUOTE */
.quote{
  backdrop-filter:blur(25px);
  padding:30px;
  border-radius:25px;
  font-size:28px;
  text-align:center;
  font-family:"Playfair Display", serif;
  background:rgba(255,255,255,0.08);
  animation:fade 1s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1;}
}

/* DATE */
.date{
  margin:20px 0;
}

/* CALENDAR */
.calendar{
  backdrop-filter:blur(25px);
  padding:20px;
  border-radius:25px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.day{
  padding:12px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.day:hover{
  background:rgba(255,255,255,0.25);
  transform:scale(1.05);
}

/* TASK LIST */
.taskList{
  margin-top:15px;
}

/* BUTTON */
.addBtn{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  font-size:30px;
  cursor:pointer;
  background:white;
  color:black;
  display:none;
}

/* TIMER */
.timer{
  font-size:80px;
  text-align:center;
  margin-top:100px;
  text-shadow:0 0 20px rgba(255,255,255,0.8);
}

/* NOTEBOOK */
.notebook{
  width:150px;
  height:200px;
  border-radius:15px;
  margin:10px;
  padding:10px;
  display:inline-block;
  cursor:pointer;
  transition:0.3s;
}
.notebook:hover{
  transform:translateY(-5px) scale(1.05);
}

/* EDITOR */
.editor{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  color:black;
  padding:30px;
  z-index:10;
}

</style>
</head>

<body>

<div class="sidebar">
  <div onclick="show('home')">Home</div>
  <div onclick="show('tasks')">Tasks</div>
  <div onclick="show('pomodoro')">Pomodoro</div>
  <div onclick="show('notes')">Notes</div>
  <div onclick="show('settings')">Settings</div>
</div>

<div class="main">

<!-- HOME -->
<div id="home">
  <div class="quote" id="quote"></div>
  <div class="date" id="date"></div>

  <div class="calendar">
    <div id="month"></div>
    <div class="grid" id="calendarGrid"></div>
  </div>

  <div class="taskList" id="dayTasks"></div>
</div>

<!-- TASKS -->
<div id="tasks" style="display:none">
  <h2>Tasks</h2>
</div>

<!-- POMODORO -->
<div id="pomodoro" style="display:none">
  <div class="timer" id="timer">25:00</div>
  <button onclick="startTimer()">Start</button>

  <h3>Settings</h3>
  Focus <input type="number" id="focus" value="25"><br>
  Short <input type="number" id="short" value="5"><br>
  Long <input type="number" id="long" value="15"><br>

  <input type="file" onchange="uploadPomodoroBg(event)">
</div>

<!-- NOTES -->
<div id="notes" style="display:none">
  <h2>Notebooks</h2>
  <div id="notebooks"></div>
</div>

<!-- SETTINGS -->
<div id="settings" style="display:none">
  <h2>Settings</h2>

  <select onchange="setBg(this.value)">
    <option value="">Default</option>
    <option value="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">Ocean</option>
    <option value="https://images.unsplash.com/photo-1492724441997-5dc865305da7">Sky</option>
  </select>

  <input type="file" onchange="uploadBg(event)">
  <input type="color" onchange="setAccent(this.value)">
</div>

</div>

<button class="addBtn" id="addBtn" onclick="handleAdd()">+</button>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");
  document.getElementById(id).style.display="block";

  document.getElementById("addBtn").style.display = id==="tasks"||id==="notes" ? "block":"none";
}

/* QUOTES */
const quotes=[
"you’re doing better than you think 🌸",
"slow progress is still progress ✨",
"be gentle with yourself 💗",
"dream big, start small ☁️",
"you deserve beautiful things 🌷",
"everything is unfolding perfectly 🌙"
];

document.getElementById("quote").innerHTML=
`<div style="opacity:0.6;font-size:14px;">daily reminder</div>
${quotes[Math.floor(Math.random()*quotes.length)]}`;

/* DATE */
let today=new Date();
document.getElementById("date").innerHTML=
`${today.toLocaleDateString(undefined,{weekday:'long'})}<br>
<span style="font-size:32px;">${today.getDate()} ${today.toLocaleDateString(undefined,{month:'long'})}</span>`;

/* CALENDAR */
function renderCalendar(){
  let grid=document.getElementById("calendarGrid");
  grid.innerHTML="";

  const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  days.forEach(d=>{
    let el=document.createElement("div");
    el.innerText=d;
    el.style.opacity="0.6";
    grid.appendChild(el);
  });

  let year=today.getFullYear();
  let month=today.getMonth();

  let first=new Date(year,month,1).getDay();
  let total=new Date(year,month+1,0).getDate();

  document.getElementById("month").innerText=
    today.toLocaleString('default',{month:'long'})+" "+year;

  for(let i=0;i<first;i++) grid.appendChild(document.createElement("div"));

  for(let i=1;i<=total;i++){
    let d=document.createElement("div");
    d.className="day";
    d.innerText=i;
    d.onclick=()=>showTasks(i);
    grid.appendChild(d);
  }
}
renderCalendar();

/* TASKS */
let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

function addTask(){
  let text=prompt("Task?");
  let date=prompt("Day number?");
  tasks.push({text,date});
  save();
}

function showTasks(day){
  let list=document.getElementById("dayTasks");
  list.innerHTML="<h3>Tasks</h3>";

  tasks.filter(t=>t.date==day).forEach(t=>{
    let d=document.createElement("div");
    d.innerText=t.text;
    list.appendChild(d);
  });
}

function save(){
  localStorage.setItem("tasks",JSON.stringify(tasks));
}

/* TIMER */
let t=1500;
function startTimer(){
  setInterval(()=>{
    t--;
    let m=Math.floor(t/60);
    let s=t%60;
    document.getElementById("timer").innerText=
    `${m}:${s<10?"0":""}${s}`;
  },1000);
}

/* NOTES */
let notebooks=JSON.parse(localStorage.getItem("notebooks"))||[];

function handleAdd(){
  let page=document.querySelector(".main > div:not([style*='none'])").id;
  if(page==="tasks") addTask();
  if(page==="notes") createNotebook();
}

function createNotebook(){
  let name=prompt("Notebook name?");
  if(!name) return;

  notebooks.push({id:Date.now(),name,color:randColor(),content:""});
  saveAll();
  renderNotebooks();
}

function renderNotebooks(){
  let c=document.getElementById("notebooks");
  c.innerHTML="";

  notebooks.forEach(nb=>{
    let d=document.createElement("div");
    d.className="notebook";
    d.style.background=nb.color;
    d.innerHTML=`${nb.name}`;
    d.onclick=()=>openNotebook(nb.id);
    c.appendChild(d);
  });
}

function openNotebook(id){
  let nb=notebooks.find(n=>n.id===id);

  let ed=document.createElement("div");
  ed.className="editor";

  ed.innerHTML=`
  <h2>${nb.name}</h2>
  <div contenteditable="true" id="editArea" style="height:70%;border:1px solid #ccc;">
  ${nb.content}
  </div>
  <br>
  <button onclick="saveNotebook(${id})">Save</button>
  <button onclick="this.parentElement.remove()">Close</button>
  `;

  document.body.appendChild(ed);
}

function saveNotebook(id){
  let nb=notebooks.find(n=>n.id===id);
  nb.content=document.getElementById("editArea").innerHTML;
  saveAll();
}

function randColor(){
  return ["#ffd6e0","#d6f0ff","#fff0d6","#e6d6ff"][Math.floor(Math.random()*4)];
}

function saveAll(){
  localStorage.setItem("notebooks",JSON.stringify(notebooks));
}

/* SETTINGS */
function uploadBg(e){
  let r=new FileReader();
  r.onload=()=>{
    document.body.style.backgroundImage=`url(${r.result})`;
    localStorage.setItem("bg",r.result);
  };
  r.readAsDataURL(e.target.files[0]);
}

function setBg(url){
  document.body.style.backgroundImage=`url(${url})`;
  localStorage.setItem("bg",url);
}

function uploadPomodoroBg(e){
  let r=new FileReader();
  r.onload=()=>{
    document.getElementById("pomodoro").style.backgroundImage=`url(${r.result})`;
  };
  r.readAsDataURL(e.target.files[0]);
}

function setAccent(c){
  document.documentElement.style.setProperty("--accent",hex(c,0.2));
}
function hex(h,a){
  let r=parseInt(h.slice(1,3),16);
  let g=parseInt(h.slice(3,5),16);
  let b=parseInt(h.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* LOAD */
window.onload=()=>{
  let bg=localStorage.getItem("bg");
  if(bg) document.body.style.backgroundImage=`url(${bg})`;
  renderNotebooks();
};

</script>

</body>
</html>
