<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planner Pro</title>

<style>
:root{
  --bg: linear-gradient(135deg,#e0e7ff,#fce7f3);
  --card: rgba(255,255,255,0.7);
  --blur: blur(15px);
  --primary:#7c83fd;
  --accent:#ff8fab;
}

body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont;
  background:var(--bg);
}

/* PAGE */
.page{
  display:none;
  padding:20px;
  padding-bottom:90px;
  animation:fade .3s;
}
.active{display:block}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

/* CARD */
.card{
  background:var(--card);
  backdrop-filter:var(--blur);
  border-radius:25px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,0.1);
}

/* HEADER */
h2{margin-top:0}

/* TASK */
.task{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-radius:15px;
  margin-top:10px;
  background:white;
}

.done{
  text-decoration:line-through;
  opacity:0.5;
}

/* INPUT */
input,select{
  padding:10px;
  border:none;
  border-radius:12px;
  margin:5px 0;
}

/* BUTTON */
button{
  border:none;
  border-radius:12px;
  padding:10px 15px;
  background:var(--primary);
  color:white;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:white;
  padding:10px 0;
  box-shadow:0 -5px 20px rgba(0,0,0,0.1);
}

.nav button{
  background:none;
  color:#555;
  font-size:12px;
}

.nav button.active{
  color:var(--primary);
}

/* TIMER */
.timer{
  font-size:50px;
  text-align:center;
}

/* CALENDAR */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  padding:10px;
  background:white;
  border-radius:10px;
  text-align:center;
}

/* NOTE */
.note{
  background:white;
  border-radius:15px;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card">
    <h2 id="date"></h2>
    <p>You’re doing better than you think 💖</p>
  </div>

  <div class="card">
    <h3>Today's Tasks</h3>
    <div id="today"></div>
  </div>
</div>

<!-- TODO -->
<div id="todo" class="page">
  <div class="card">
    <h2>Tasks</h2>

    <input id="taskInput" placeholder="Task">
    <input type="date" id="dueDate">
    <button onclick="addTask()">Add</button>

    <div id="taskList"></div>
  </div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="page">
  <div class="card">
    <h2>Calendar</h2>
    <div class="grid" id="cal"></div>
  </div>
</div>

<!-- POMODORO -->
<div id="pomodoro" class="page">
  <div class="card">
    <h2>Pomodoro</h2>

    <div class="timer" id="timer">25:00</div>

    <input id="minutes" type="number" placeholder="Minutes">
    <button onclick="start()">Start</button>
    <button onclick="reset()">Reset</button>
  </div>
</div>

<!-- NOTES -->
<div id="notes" class="page">
  <div class="card">
    <h2>Notes</h2>

    <input id="ntitle" placeholder="Title">
    <input id="ntext" placeholder="Write note">
    <button onclick="saveNote()">Save</button>

    <div id="notesList"></div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="nav('home',this)" class="active">🏠 Home</button>
  <button onclick="nav('todo',this)">✔ Tasks</button>
  <button onclick="nav('calendar',this)">📅 Calendar</button>
  <button onclick="nav('pomodoro',this)">⏱ Focus</button>
  <button onclick="nav('notes',this)">📓 Notes</button>
</div>

<script>

/* NAV */
function nav(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* DATE */
date.innerText=new Date().toDateString();

/* TASKS */
let tasks=JSON.parse(localStorage.getItem("tasks")||"[]");

function addTask(){
  tasks.push({
    text:taskInput.value,
    date:dueDate.value,
    done:false
  });
  save();
  render();
}

function toggle(i){
  tasks[i].done=!tasks[i].done;
  save(); render();
}

function del(i){
  tasks.splice(i,1);
  save(); render();
}

function render(){
  let html="";
  tasks.forEach((t,i)=>{
    html+=`
    <div class="task ${t.done?'done':''}">
      ${t.text} (${t.date||''})
      <div>
        <button onclick="toggle(${i})">✔</button>
        <button onclick="del(${i})">✖</button>
      </div>
    </div>`;
  });
  taskList.innerHTML=html;
  today.innerHTML=html;
}

function save(){
  localStorage.setItem("tasks",JSON.stringify(tasks));
}

render();

/* CALENDAR */
for(let i=1;i<=31;i++){
  let d=document.createElement("div");
  d.className="day";
  d.innerText=i;
  cal.appendChild(d);
}

/* TIMER */
let t=1500, inter;

function start(){
  let m=document.getElementById("minutes").value;
  if(m) t=m*60;

  clearInterval(inter);
  inter=setInterval(()=>{
    if(t<=0)return clearInterval(inter);
    t--;
    timer.innerText=
      Math.floor(t/60)+":"+(t%60<10?"0":"")+t%60;
  },1000);
}

function reset(){
  clearInterval(inter);
  t=1500;
  timer.innerText="25:00";
}

/* NOTES */
let notes=JSON.parse(localStorage.getItem("notes")||"[]");

function saveNote(){
  notes.push({t:ntitle.value,c:ntext.value});
  localStorage.setItem("notes",JSON.stringify(notes));
  renderNotes();
}

function renderNotes(){
  notesList.innerHTML="";
  notes.forEach(n=>{
    notesList.innerHTML+=`
    <div class="note">
      <b>${n.t}</b>
      <p>${n.c}</p>
    </div>`;
  });
}

renderNotes();

</script>

</body>
</html>
