<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>

<style>
:root{
  --accent: rgba(255,255,255,0.2);
}

*{
  box-sizing:border-box;
  margin:0;
  font-family: "SF Pro Display", sans-serif;
}

body{
  height:100vh;
  display:flex;
  background-size:cover;
  background-position:center;
  color:white;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:200px;
  backdrop-filter: blur(20px);
  background: var(--accent);
  padding:20px;
}

.sidebar div{
  margin:15px 0;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:30px;
  overflow:auto;
}

/* CENTER POMODORO */
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
  flex-direction:column;
}

.timer{
  font-size:80px;
  font-weight:200;
  transition:0.3s;
}

/* ADD BUTTON */
.addBtn{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  font-size:30px;
  cursor:pointer;
  background:white;
  color:black;
}

/* POPUP */
#popup{
  position:fixed;
  bottom:100px;
  right:30px;
  background:white;
  color:black;
  border-radius:12px;
  display:none;
  overflow:hidden;
}

#popup div{
  padding:12px 20px;
  cursor:pointer;
}
#popup div:hover{
  background:#eee;
}

/* NOTES */
.section{
  margin-top:15px;
  backdrop-filter: blur(15px);
  padding:10px;
  border-radius:10px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.taskItem{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

/* SETTINGS */
.settings input{
  margin:10px 0;
}
</style>
</head>

<body>

<div class="sidebar">
  <div onclick="show('home')">Home</div>
  <div onclick="show('notes')">Planner</div>
  <div onclick="show('settings')">Settings</div>
</div>

<div class="main">

  <!-- HOME -->
  <div id="home" class="center">
    <div class="timer" id="timer">25:00</div>
    <button onclick="startTimer()">Start</button>
  </div>

  <!-- NOTES -->
  <div id="notes" style="display:none">
    <h2>Planner</h2>
    <div id="sections"></div>
  </div>

  <!-- SETTINGS -->
  <div id="settings" style="display:none" class="settings">
    <h2>Settings</h2>

    <p>Background</p>
    <input type="file" onchange="uploadBg(event)">

    <p>Accent</p>
    <input type="color" onchange="setAccent(this.value)">
  </div>

</div>

<!-- ADD BUTTON -->
<button class="addBtn" onclick="togglePopup()">+</button>

<!-- POPUP -->
<div id="popup">
  <div onclick="createTaskUI()">Task</div>
  <div onclick="createSection()">Section</div>
</div>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");
  document.getElementById(id).style.display="block";
}

/* TIMER */
let time=1500;
let running=false;

function startTimer(){
  if(running) return;
  running=true;

  let interval=setInterval(()=>{
    time--;
    let m=Math.floor(time/60);
    let s=time%60;
    document.getElementById("timer").innerText=
      `${m}:${s<10?"0":""}${s}`;

    if(time<=0){
      clearInterval(interval);
      running=false;
      time=1500;
    }
  },1000);
}

/* POPUP */
function togglePopup(){
  let p=document.getElementById("popup");
  p.style.display = p.style.display==="block" ? "none" : "block";
}

/* NOTES DATA */
let sections = JSON.parse(localStorage.getItem("sections")) || [];
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

/* SAVE */
function save(){
  localStorage.setItem("sections", JSON.stringify(sections));
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

/* CREATE SECTION */
function createSection(){
  let name = prompt("Section name");
  if(!name) return;

  sections.push({id:Date.now(), name});
  save();
  render();
}

/* CREATE TASK */
function createTaskUI(sectionId=null){
  togglePopup();

  let text = prompt("Task?");
  if(!text) return;

  let date = prompt("Due date YYYY-MM-DD");

  tasks.push({
    id:Date.now(),
    text,
    date,
    sectionId
  });

  save();
  render();
}

/* RENDER */
function render(){
  let container=document.getElementById("sections");
  container.innerHTML="";

  sections.forEach(sec=>{
    let div=document.createElement("div");
    div.className="section";

    div.innerHTML=`
      <div class="section-title">
        ${sec.name}
        <button onclick="createTaskUI(${sec.id})">+</button>
      </div>
      <div id="tasks-${sec.id}"></div>
    `;

    container.appendChild(div);

    let taskDiv=document.getElementById(`tasks-${sec.id}`);

    tasks.filter(t=>t.sectionId===sec.id)
    .forEach(t=>{
      let el=document.createElement("div");
      el.className="taskItem";

      el.innerHTML=`
        <span>${t.text}</span>
        <input type="date" value="${t.date||""}" 
        onchange="updateDate(${t.id}, this.value)">
      `;

      taskDiv.appendChild(el);
    });
  });
}

/* UPDATE DATE */
function updateDate(id, val){
  let t=tasks.find(x=>x.id===id);
  t.date=val;
  save();
}

/* SETTINGS */
function uploadBg(e){
  let file=e.target.files[0];
  let reader=new FileReader();

  reader.onload=function(){
    document.body.style.backgroundImage=`url(${reader.result})`;
    localStorage.setItem("bg", reader.result);
  };

  reader.readAsDataURL(file);
}

function setAccent(c){
  document.documentElement.style.setProperty("--accent", hexToRGBA(c, 0.25));
}

function hexToRGBA(hex, alpha){
  let r=parseInt(hex.slice(1,3),16);
  let g=parseInt(hex.slice(3,5),16);
  let b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* LOAD */
window.onload=function(){
  let bg=localStorage.getItem("bg");
  if(bg) document.body.style.backgroundImage=`url(${bg})`;

  render();
}

</script>

</body>
</html>
