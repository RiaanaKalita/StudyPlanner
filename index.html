<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aesthetic iPad Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root{
  --accent: rgba(255,255,255,0.2);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  color:white;
  overflow:hidden;
}

/* 🌄 BACKGROUND */
#bg{
  position:fixed;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  z-index:-1;
  transition:1s;
  filter:brightness(0.85);
}

/* 🌸 SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  height:100%;
  width:200px;
  backdrop-filter:blur(20px);
  background:var(--accent);
  padding:30px;
  display:flex;
  flex-direction:column;
  gap:15px;
  transition:0.3s;
}

.logo{
  font-family:'Playfair Display';
  font-size:24px;
  margin-bottom:20px;
}

.tab{
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.tab:hover{background:rgba(255,255,255,0.2)}
.active{background:white;color:black}

/* 🪟 MAIN */
.main{
  margin-left:220px;
  padding:30px;
  height:100vh;
  overflow:auto;
}

/* ✨ CARD */
.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:20px;
  margin-bottom:20px;
}

/* 🏠 */
.title{
  font-family:'Playfair Display';
  font-size:36px;
}

/* ➕ */
.addBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  border:none;
  font-size:28px;
  cursor:pointer;
}

/* 📋 TASK */
.task{
  display:flex;
  justify-content:space-between;
  padding:8px;
}

/* 🍅 */
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
  flex-direction:column;
}

.timer{
  font-size:90px;
  font-family:'Playfair Display';
}

/* 📓 NOTEBOOK GRID */
#notebookGrid{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.notebook{
  width:120px;
  height:180px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.2);
  cursor:pointer;
}

/* FULL NOTEBOOK */
#notebookView{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  color:black;
  display:none;
  flex-direction:column;
}

.notebookHeader{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#eee;
}

canvas{
  flex:1;
  background:#fffef8;
}

.tools{
  display:flex;
  gap:10px;
  padding:10px;
  background:#eee;
}

/* SETTINGS */
.settings input{width:100%}

</style>
</head>

<body>

<div id="bg"></div>

<div class="sidebar">
  <div class="logo">Planner</div>
  <div class="tab active" onclick="switchTab('home',this)">Home</div>
  <div class="tab" onclick="switchTab('tasks',this)">Tasks</div>
  <div class="tab" onclick="switchTab('pomodoro',this)">Pomodoro</div>
  <div class="tab" onclick="switchTab('notes',this)">Notebooks</div>
  <div class="tab" onclick="switchTab('settings',this)">Settings</div>
</div>

<div class="main">

<div id="home">
  <div class="card">
    <div class="title" id="date"></div>
    <div>“You’re doing amazing.” 🌸</div>
  </div>
</div>

<div id="tasks" style="display:none">
  <div class="card">
    <h2>Tasks</h2>
    <div id="taskList"></div>
  </div>
</div>

<div id="pomodoro" style="display:none">
  <div class="center">
    <div class="timer" id="timer">25:00</div>
    <button onclick="start()">Start</button>
    <button onclick="reset()">Reset</button>
  </div>
</div>

<div id="notes" style="display:none">
  <div class="card">
    <button onclick="addNotebook()">+ Notebook</button>
    <div id="notebookGrid"></div>
  </div>
</div>

<div id="settings" style="display:none">
  <div class="card settings">
    <h2>Settings</h2>
    <input type="color" onchange="setAccent(this.value)">
    <input type="file" onchange="uploadBg(event)">
  </div>
</div>

</div>

<button class="addBtn" id="plus" onclick="addTask()">+</button>

<!-- NOTEBOOK -->
<div id="notebookView">
  <div class="notebookHeader">
    <button onclick="closeNotebook()">Back</button>
    <span id="nbTitle"></span>
  </div>

  <canvas id="canvas"></canvas>

  <div class="tools">
    <input type="color" id="colorPicker">
    <button onclick="tool='pen'">Pen</button>
    <button onclick="tool='highlight'">Highlight</button>
    <button onclick="addText()">Text</button>
    <input type="file" onchange="addImage(event)">
  </div>
</div>

<script>

/* BACKGROUND */
let bg=document.getElementById("bg");
let saved=localStorage.getItem("bg");
if(saved) bg.style.backgroundImage=`url(${saved})`;

function uploadBg(e){
 let r=new FileReader();
 r.onload=x=>{
  bg.style.backgroundImage=`url(${x.target.result})`;
  localStorage.setItem("bg",x.target.result);
 };
 r.readAsDataURL(e.target.files[0]);
}

/* ACCENT */
function setAccent(c){
 document.querySelector(".sidebar").style.background=c;
}

/* DATE */
date.innerText=new Date().toDateString();

/* NAV */
function switchTab(id,el){
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");

 document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");
 document.getElementById(id).style.display="block";
}

/* TASKS */
let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

function addTask(){
 let text=prompt("Task?");
 let date=prompt("Due date?");
 if(!text)return;

 tasks.push({text,date});
 localStorage.setItem("tasks",JSON.stringify(tasks));
 renderTasks();
}

function renderTasks(){
 taskList.innerHTML="";
 tasks.forEach(t=>{
  taskList.innerHTML+=`<div class="task">${t.text} ${t.date||""}</div>`;
 });
}
renderTasks();

/* 🍅 */
let t=1500,int;
function start(){
 if(int)return;
 int=setInterval(()=>{
  t--;
  timer.innerText=Math.floor(t/60)+":"+("0"+t%60).slice(-2);
 },1000);
}
function reset(){clearInterval(int);t=1500;}

/* 📓 NOTEBOOK */
let notebooks=JSON.parse(localStorage.getItem("nb"))||[];

function addNotebook(){
 let name=prompt("Name?");
 notebooks.push({name});
 localStorage.setItem("nb",JSON.stringify(notebooks));
 renderNB();
}

function renderNB(){
 notebookGrid.innerHTML="";
 notebooks.forEach((n,i)=>{
  notebookGrid.innerHTML+=`
  <div class="notebook" onclick="openNB(${i})">${n.name}</div>`;
 });
}
renderNB();

function openNB(i){
 notebookView.style.display="flex";
 nbTitle.innerText=notebooks[i].name;
 initCanvas();
}

function closeNotebook(){
 notebookView.style.display="none";
}

/* CANVAS */
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let drawing=false, tool="pen";

canvas.onmousedown=()=>drawing=true;
canvas.onmouseup=()=>drawing=false;

canvas.onmousemove=e=>{
 if(!drawing)return;
 ctx.strokeStyle=colorPicker.value;
 ctx.lineWidth=tool==="pen"?2:10;
 ctx.lineTo(e.clientX,e.clientY);
 ctx.stroke();
};

/* TEXT */
function addText(){
 let t=prompt("Text?");
 ctx.fillText(t,100,100);
}

/* IMAGE */
function addImage(e){
 let r=new FileReader();
 r.onload=x=>{
  let img=new Image();
  img.onload=()=>ctx.drawImage(img,100,100,150,150);
  img.src=x.target.result;
 };
 r.readAsDataURL(e.target.files[0]);
}

</script>

</body>
</html>
