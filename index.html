<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Planner Pro</title>

<style>
:root{
  --bg: linear-gradient(135deg,#e0e7ff,#fce7f3);
  --card: rgba(255,255,255,0.7);
}

body{
  margin:0;
  font-family:-apple-system;
  background:var(--bg);
}

/* PAGES */
.page{display:none;padding:20px;padding-bottom:90px;}
.active{display:block}

/* CARD */
.card{
  background:var(--card);
  backdrop-filter:blur(15px);
  border-radius:25px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:white;
  padding:10px 0;
}

/* BUTTON */
button{
  border:none;
  padding:8px 12px;
  border-radius:10px;
  background:#7c83fd;
  color:white;
}

/* FLOAT BUTTON */
.fab{
  position:fixed;
  bottom:90px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#7c83fd;
  color:white;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* TASK */
.section{
  margin-top:10px;
}
.sectionHeader{
  font-weight:bold;
  cursor:pointer;
}
.task{
  display:flex;
  justify-content:space-between;
  margin-left:10px;
}

/* NOTEBOOK */
#notebookGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.notebook{
  height:100px;
  border-radius:15px;
  display:flex;
  align-items:end;
  padding:10px;
}

/* POMODORO */
.timer{
  font-size:50px;
  text-align:center;
}

/* CALENDAR */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.day{
  background:white;
  padding:8px;
  border-radius:10px;
  text-align:center;
}

/* NOTEBOOK VIEW */
.pageArea{
  height:60vh;
  background:white;
  border-radius:15px;
  padding:10px;
  overflow:auto;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
<div class="card">
<h2 id="date"></h2>
<p>✨ “You’re becoming the version of you that you needed.”</p>
</div>

<div class="card">
<h3>Calendar</h3>
<div class="grid" id="homeCal"></div>
</div>

<div class="card">
<h3>Today</h3>
<div id="todayTasks"></div>
</div>
</div>

<!-- TASKS -->
<div id="tasks" class="page">
<div class="card">
<h2>Planner</h2>
<div id="sections"></div>
<div id="noSection"></div>
<div class="card"><h3>Completed</h3><div id="done"></div></div>
</div>
<div class="fab" onclick="addOption()">＋</div>
</div>

<!-- NOTES -->
<div id="notes" class="page">
<div id="notebookGrid"></div>
<div class="fab" onclick="createNotebook()">＋</div>
</div>

<div id="notebookView" class="page">
<div class="card">
<div id="pageArea" contenteditable="true" class="pageArea"></div>
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
<button onclick="addPage()">＋</button>
<input type="file" onchange="imgAdd(event)">
<button onclick="back()">Back</button>
</div>
</div>

<!-- POMODORO -->
<div id="pomodoro" class="page">
<div class="card" id="pomoCard">
<h2>Pomodoro</h2>

<select id="mode">
<option value="1500">Work</option>
<option value="300">Short Break</option>
<option value="900">Long Break</option>
</select>

<div class="timer" id="timer">25:00</div>

<button onclick="start()">Start</button>
<button onclick="reset()">Reset</button>

<select onchange="bgChange(this.value)">
<option>City</option>
<option>Garden</option>
<option>Pond</option>
<option>Tokyo</option>
</select>

<input type="file" onchange="customBg(event)">
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="nav('home')">🏠</button>
<button onclick="nav('tasks')">✔</button>
<button onclick="nav('notes')">📓</button>
<button onclick="nav('pomodoro')">⏱</button>
</div>

<script>

/* NAV */
function nav(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.getElementById(p).classList.add('active');
}

/* DATE */
date.innerText=new Date().toDateString();

/* CALENDAR */
for(let i=1;i<=30;i++){
let d=document.createElement("div");
d.className="day";
d.innerText=i;
homeCal.appendChild(d);
}

/* TASK SYSTEM */
let data=JSON.parse(localStorage.getItem("data")||"[]");

function addOption(){
let type=prompt("section or task?");
if(type=="section"){
data.push({type:"section",name:prompt("Name"),open:true,tasks:[]});
}else{
data.push({type:"task",text:prompt("Task"),done:false});
}
save();render();
}

function render(){
sections.innerHTML="";
noSection.innerHTML="";
done.innerHTML="";

data.forEach((d,i)=>{
if(d.type=="section"){
let html=`<div class="section">
<div class="sectionHeader" onclick="toggle(${i})">${d.name}</div>`;
if(d.open){
d.tasks.forEach((t,ti)=>{
html+=`<div class="task">${t.text}
<button onclick="doneTask(${i},${ti})">✔</button></div>`;
});
}
html+="</div>";
sections.innerHTML+=html;
}else{
if(d.done){
done.innerHTML+=d.text+"<br>";
}else{
noSection.innerHTML+=`<div class="task">${d.text}
<button onclick="doneSingle(${i})">✔</button></div>`;
}
}
});
}

function toggle(i){data[i].open=!data[i].open;save();render();}
function doneTask(i,ti){data[i].tasks[ti].done=true;save();render();}
function doneSingle(i){data[i].done=true;save();render();}
function save(){localStorage.setItem("data",JSON.stringify(data));}
render();

/* NOTEBOOK SYSTEM */
let nbs=JSON.parse(localStorage.getItem("nbs")||"[]");
let cur=0,pg=0;

function createNotebook(){
let title=prompt("Title?");
let color=prompt("Color?");
nbs.push({title,color,pages:[""]});
saveNB();renderNB();
}

function renderNB(){
notebookGrid.innerHTML="";
nbs.forEach((n,i)=>{
notebookGrid.innerHTML+=`<div class="notebook" style="background:${n.color}" onclick="openNB(${i})">${n.title}</div>`;
});
}
renderNB();

function openNB(i){
cur=i;pg=0;
nav('notebookView');
load();
}

function load(){
pageArea.innerHTML=nbs[cur].pages[pg];
}

function savePage(){
nbs[cur].pages[pg]=pageArea.innerHTML;
saveNB();
}

function next(){savePage();pg++;if(!nbs[cur].pages[pg])nbs[cur].pages[pg]="";load();}
function prev(){if(pg>0){savePage();pg--;load();}}
function addPage(){nbs[cur].pages.push("");pg=nbs[cur].pages.length-1;load();}
function imgAdd(e){
let r=new FileReader();
r.onload=()=>{pageArea.innerHTML+=`<img src="${r.result}" style="max-width:100%">`;savePage();}
r.readAsDataURL(e.target.files[0]);
}
function back(){nav('notes');}
function saveNB(){localStorage.setItem("nbs",JSON.stringify(nbs));}

/* POMODORO */
let t=1500,int;

function start(){
t=parseInt(mode.value);
clearInterval(int);
int=setInterval(()=>{
if(t<=0)return clearInterval(int);
t--;
timer.innerText=Math.floor(t/60)+":"+(t%60<10?"0":"")+t%60;
},1000);
}
function reset(){t=1500;timer.innerText="25:00";}

/* BG */
function bgChange(v){
if(v=="City")pomoCard.style.background="url(https://images.unsplash.com/photo-1494526585095-c41746248156)";
if(v=="Garden")pomoCard.style.background="url(https://images.unsplash.com/photo-1501004318641-b39e6451bec6)";
if(v=="Pond")pomoCard.style.background="url(https://images.unsplash.com/photo-1507525428034-b723cf961d3e)";
if(v=="Tokyo")pomoCard.style.background="url(https://images.unsplash.com/photo-1549692520-acc6669e2f0c)";
pomoCard.style.backgroundSize="cover";
}

function customBg(e){
let r=new FileReader();
r.onload=()=>pomoCard.style.background=`url(${r.result})`;
r.readAsDataURL(e.target.files[0]);
}

</script>

</body>
</html>
