<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aesthetic Planner Pro</title>

<style>

/* ---------------- GLOBAL ---------------- */
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --accent:#a5b4fc;
  --text:#2a2a2a;
}

body{
  margin:0;
  font-family:"Inter", sans-serif;
  display:flex;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
}

/* ---------------- SIDEBAR ---------------- */
.sidebar{
  width:230px;
  background:linear-gradient(180deg,#111827,#1f2937);
  color:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:600;
  margin-bottom:10px;
}

.nav{
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.nav:hover{
  background:rgba(255,255,255,0.1);
}

/* ---------------- MAIN ---------------- */
.main{
  flex:1;
  overflow:auto;
  padding:20px;
}

.page{display:none;}
.active{display:block;}

/* ---------------- HOME ---------------- */
.hero{
  font-size:28px;
  font-weight:600;
}

.quote{
  opacity:0.7;
  margin-top:5px;
}

/* ---------------- TASKS ---------------- */
.section{
  margin-bottom:15px;
}

.section-title{
  font-weight:600;
  cursor:pointer;
}

.task{
  display:flex;
  justify-content:space-between;
  padding:8px;
  margin:5px 0;
  border-radius:10px;
  background:#eef2ff;
  transition:0.3s;
}

.task:hover{transform:scale(1.02);}

.done{
  text-decoration:line-through;
  opacity:0.5;
}

button{
  border:none;
  background:var(--accent);
  color:white;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* FLOAT BUTTON */
.add{
  position:fixed;
  bottom:20px;
  left:260px;
  font-size:22px;
  padding:15px;
  border-radius:50%;
}

/* ---------------- CALENDAR ---------------- */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:15px;
}

.day{
  padding:12px;
  border-radius:10px;
  background:white;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.day:hover{
  background:#e0e7ff;
}

/* ---------------- POMODORO ---------------- */
#pomodoro{
  position:relative;
  height:100%;
  padding:0;
}

#pomodoroBg{
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.6);
  transition:1s;
}

.pomodoro-center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
}

#timer{
  font-size:90px;
  font-weight:600;
  margin-bottom:20px;
  animation:fade 1s;
}

.controls button{
  margin:5px;
  font-size:16px;
}

.settings{
  margin-top:15px;
  opacity:0.9;
}

.theme-select{
  margin-top:15px;
}

/* ---------------- NOTES ---------------- */
.notebook{
  background:#fef3c7;
  padding:20px;
  border-radius:15px;
  margin-bottom:10px;
  cursor:pointer;
  transition:0.3s;
}

.notebook:hover{
  transform:scale(1.03);
}

/* ---------------- ANIMATIONS ---------------- */
@keyframes fade{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<div class="sidebar">
<div class="logo">Planner</div>

<div class="nav" onclick="openPage('home')">🏠 Home</div>
<div class="nav" onclick="openPage('tasks')">✅ Tasks</div>
<div class="nav" onclick="openPage('pomodoro')">🍅 Focus</div>
<div class="nav" onclick="openPage('notes')">📓 Notes</div>
</div>

<div class="main">

<!-- HOME -->
<div id="home" class="page active">
<div class="hero" id="date"></div>
<div class="quote">You’re doing better than you think.</div>

<h3 id="monthTitle"></h3>
<div class="calendar" id="calendar"></div>
</div>

<!-- TASKS -->
<div id="tasks" class="page">
<div id="taskList"></div>
<button class="add" onclick="openTaskMenu()">＋</button>
</div>

<!-- POMODORO -->
<div id="pomodoro" class="page">

<div id="pomodoroBg"></div>

<div class="pomodoro-center">
<div id="timer">25:00</div>

<div class="controls">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

<div class="settings">
Work <input id="work" value="25">
Short <input id="short" value="5">
Long <input id="long" value="15">
</div>

<div class="theme-select">
<button onclick="setBg(0)">City</button>
<button onclick="setBg(1)">Cafe</button>
<button onclick="setBg(2)">Nature</button>
<button onclick="setBg(3)">Tokyo</button>
</div>
</div>

</div>

<!-- NOTES -->
<div id="notes" class="page">
<div id="books"></div>
<button class="add" onclick="addBook()">＋</button>
</div>

</div>

<script>

/* NAV */
function openPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* DATE */
date.innerText=new Date().toDateString();

/* STORAGE */
let tasks = JSON.parse(localStorage.getItem("tasks")||"[]");

/* TASK SYSTEM */
function openTaskMenu(){
let text=prompt("Task name");
let date=prompt("Due date YYYY-MM-DD");
tasks.push({text,date,done:false});
saveTasks(); renderTasks();
}

function renderTasks(){
taskList.innerHTML="";
tasks.forEach((t,i)=>{
taskList.innerHTML+=`
<div class="task ${t.done?'done':''}">
${t.text} (${t.date||''})
<div>
<button onclick="toggleTask(${i})">✔</button>
<button onclick="deleteTask(${i})">✖</button>
</div>
</div>`;
});
}

function toggleTask(i){
tasks[i].done=!tasks[i].done;
saveTasks(); renderTasks();
}

function deleteTask(i){
tasks.splice(i,1);
saveTasks(); renderTasks();
}

function saveTasks(){
localStorage.setItem("tasks",JSON.stringify(tasks));
}

/* CALENDAR */
function renderCalendar(){
calendar.innerHTML="";
let now=new Date();
let days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();

monthTitle.innerText=now.toLocaleString('default',{month:'long'})+" "+now.getFullYear();

for(let d=1;d<=days;d++){
calendar.innerHTML+=`<div class="day">${d}</div>`;
}
}

/* POMODORO */
let time=1500, interval;

let backgrounds=[
"url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb')",
"url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085')",
"url('https://images.unsplash.com/photo-1501785888041-af3ef285b470')",
"url('https://images.unsplash.com/photo-1549692520-acc6669e2f0c')"
];

function setBg(i){
pomodoroBg.style.backgroundImage=backgrounds[i];
}

setBg(1);

function startTimer(){
clearInterval(interval);
interval=setInterval(()=>{
time--;
timer.innerText=format(time);
},1000);
}

function pauseTimer(){
clearInterval(interval);
}

function resetTimer(){
time=work.value*60;
timer.innerText=format(time);
}

function format(t){
let m=Math.floor(t/60);
let s=t%60;
return `${m}:${s<10?'0':''}${s}`;
}

/* NOTES */
let books = JSON.parse(localStorage.getItem("books")||"[]");

function addBook(){
let name=prompt("Notebook name");
books.push({name,content:""});
saveBooks(); renderBooks();
}

function renderBooks(){
booksDiv.innerHTML="";
books.forEach((b,i)=>{
booksDiv.innerHTML+=`
<div class="notebook" onclick="openBook(${i})">${b.name}</div>`;
});
}

function openBook(i){
let text=prompt("Write notes",books[i].content);
books[i].content=text;
saveBooks(); renderBooks();
}

function saveBooks(){
localStorage.setItem("books",JSON.stringify(books));
}

/* INIT */
renderTasks();
renderCalendar();
renderBooks();

</script>

</body>
</html>
