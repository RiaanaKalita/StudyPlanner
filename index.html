<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root{
  --accent:#ff8fab;
}

/* BASE */
body{
  margin:0;
  font-family:'Inter',sans-serif;
  color:#1a1a1a;
  overflow:hidden;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.45);
  backdrop-filter:blur(10px);
  z-index:-1;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  width:200px;
  height:100%;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(12px);
  padding:20px;
}

.sidebar div{
  margin:15px 0;
  cursor:pointer;
}

/* MAIN */
.main{
  margin-left:220px;
  padding:30px;
  height:100vh;
  overflow:auto;
}

/* TASKS */
.section-header{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  font-weight:600;
}

.task{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.5);
}

/* PLUS */
.plus{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:white;
  font-size:28px;
}

/* MENU */
.menu{
  position:fixed;
  bottom:100px;
  right:30px;
  background:white;
  border-radius:12px;
  display:none;
  overflow:hidden;
}

.menu div{
  padding:12px 20px;
  cursor:pointer;
}

.menu div:hover{
  background:#eee;
}

</style>
</head>

<body>

<div class="sidebar">
  <div onclick="show('home')">Home</div>
  <div onclick="show('notes')">Notes</div>
  <div onclick="show('settings')">Settings</div>
</div>

<div class="main">

  <div id="home">
    <h1>Planner 🌸</h1>
    <p>romanticize your life ✨</p>
  </div>

  <div id="notes" style="display:none;"></div>

  <div id="settings" style="display:none;">
    <h2>Settings</h2>

    <h4>Choose preset background</h4>
    <button onclick="setBg('tokyo')">Tokyo</button>
    <button onclick="setBg('cafe')">Cafe</button>
    <button onclick="setBg('garden')">Garden</button>

    <h4>Upload background</h4>
    <input type="file" onchange="uploadBg(event)">
  </div>

</div>

<button class="plus" onclick="toggleMenu()">+</button>

<div class="menu" id="menu">
  <div onclick="createTask()">Task</div>
  <div onclick="createSection()">Section</div>
</div>

<script>

/* DATA */
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let sections = JSON.parse(localStorage.getItem("sections")) || [];

/* SAVE */
function save(){
  localStorage.setItem("tasks", JSON.stringify(tasks));
  localStorage.setItem("sections", JSON.stringify(sections));
}

/* NAV */
function show(page){
  ["home","notes","settings"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(page).style.display="block";
  render();
}

/* MENU */
function toggleMenu(){
  let m=document.getElementById("menu");
  m.style.display = m.style.display==="block"?"none":"block";
}

/* ADD */
function createSection(){
  let name = prompt("Section name");
  if(!name) return;

  sections.push({id:Date.now(),name,open:true});
  save();
  render();
}

function createTask(sectionId=null){
  let text = prompt("Task");
  if(!text) return;

  let date = prompt("Due date YYYY-MM-DD");

  tasks.push({
    id:Date.now(),
    text,
    date,
    sectionId,
    done:false
  });

  save();
  render();
}

/* TOGGLE */
function toggleSection(id){
  let s=sections.find(x=>x.id===id);
  s.open=!s.open;
  save();
  render();
}

function toggleTask(id){
  let t=tasks.find(x=>x.id===id);
  t.done=!t.done;
  save();
  render();
}

/* DELETE */
function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  save();
  render();
}

/* RENDER */
function render(){
  let el=document.getElementById("notes");
  el.innerHTML="";

  sections.forEach(sec=>{
    let box=document.createElement("div");

    box.innerHTML = `
      <div class="section-header">
        <span onclick="toggleSection(${sec.id})">
          ${sec.open ? "▼" : "▶"} ${sec.name}
        </span>
        <button onclick="createTask(${sec.id})">+</button>
      </div>
    `;

    if(sec.open){
      tasks.filter(t=>t.sectionId===sec.id && !t.done).forEach(t=>{
        box.innerHTML += taskHTML(t);
      });
    }

    el.appendChild(box);
  });

  /* NO SECTION */
  tasks.filter(t=>!t.sectionId && !t.done).forEach(t=>{
    el.innerHTML += taskHTML(t);
  });

  /* COMPLETED */
  let done = tasks.filter(t=>t.done);
  if(done.length){
    el.innerHTML += "<h3>Completed</h3>";
    done.forEach(t=>{
      el.innerHTML += taskHTML(t);
    });
  }
}

/* TASK HTML */
function taskHTML(t){
  return `
    <div class="task">
      <span onclick="toggleTask(${t.id})">
        ${t.done ? "✔" : "○"} ${t.text}
      </span>
      <small>${t.date || ""}</small>
      <button onclick="deleteTask(${t.id})">x</button>
    </div>
  `;
}

/* BACKGROUNDS */
function setBg(type){
  let url={
    tokyo:"https://images.unsplash.com/photo-1505060895624-73cc6d3c8c6e",
    cafe:"https://images.unsplash.com/photo-1509042239860-f550ce710b93",
    garden:"https://images.unsplash.com/photo-1466692476868-aef1dfb1e735"
  }[type];

  document.body.style.backgroundImage=`url(${url})`;
  localStorage.setItem("bg", url);
}

/* UPLOAD BG */
function uploadBg(e){
  let file=e.target.files[0];
  let reader=new FileReader();

  reader.onload=function(x){
    document.body.style.backgroundImage=`url(${x.target.result})`;
    localStorage.setItem("bg", x.target.result);
  };

  reader.readAsDataURL(file);
}

/* LOAD BG */
let savedBg = localStorage.getItem("bg");
if(savedBg){
  document.body.style.backgroundImage=`url(${savedBg})`;
}

/* INIT */
render();

</script>

</body>
</html>
