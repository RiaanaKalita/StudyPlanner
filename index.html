<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#ff8fab;
}

/* RESET */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Inter',sans-serif;
}

/* BACKGROUND SYSTEM */
body{
  height:100vh;
  overflow:hidden;
  color:#1a1a1a;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(10px);
  z-index:-1;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  width:200px;
  height:100%;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(14px);
  padding:20px;
}

.sidebar div{
  margin:15px 0;
  cursor:pointer;
  font-weight:500;
}

/* MAIN */
.main{
  margin-left:220px;
  padding:30px;
  height:100%;
  overflow:auto;
}

/* HOME */
.home h1{
  font-size:32px;
  margin-bottom:10px;
}

.quote{
  margin:20px 0;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.5);
}

/* TASKS */
.section{
  margin-top:20px;
}

.section-header{
  font-weight:600;
  cursor:pointer;
}

.task{
  display:flex;
  justify-content:space-between;
  padding:10px;
  margin-top:5px;
  background:rgba(255,255,255,0.5);
  border-radius:10px;
}

.task small{
  opacity:0.6;
}

/* PLUS BUTTON */
.plus{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* DROPDOWN */
.dropdown{
  position:fixed;
  bottom:100px;
  right:30px;
  background:white;
  border-radius:10px;
  overflow:hidden;
  display:none;
}

.dropdown div{
  padding:10px 20px;
  cursor:pointer;
}

.dropdown div:hover{
  background:#eee;
}

/* POMODORO */
.pomodoro{
  display:none;
  text-align:center;
  margin-top:100px;
}

.timer{
  font-size:80px;
  margin:20px;
}

/* SETTINGS */
.settings{
  display:none;
}

select{
  padding:8px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="sidebar">
  <div onclick="show('home')">Home</div>
  <div onclick="show('tasks')">Tasks</div>
  <div onclick="show('pomodoro')">Pomodoro</div>
  <div onclick="show('settings')">Settings</div>
</div>

<div class="main">

  <div id="home">
    <h1>Planner 🌸</h1>
    <div class="quote">“romanticize your life”</div>
    <div id="calendar"></div>
  </div>

  <div id="tasks" style="display:none;"></div>

  <div id="pomodoro" class="pomodoro">
    <div class="timer" id="timer">25:00</div>
    <button onclick="start()">Start</button>
    <button onclick="reset()">Reset</button>
  </div>

  <div id="settings" class="settings">
    <h2>Settings</h2>

    <label>Background</label><br>
    <select onchange="setBg(this.value)">
      <option value="tokyo">Tokyo</option>
      <option value="cafe">Cafe</option>
      <option value="garden">Garden</option>
    </select>

    <br><br>

    <label>Accent</label><br>
    <input type="color" onchange="setAccent(this.value)">
  </div>

</div>

<button class="plus" onclick="toggleMenu()">+</button>

<div class="dropdown" id="menu">
  <div onclick="addTask()">Task</div>
  <div onclick="addSection()">Section</div>
</div>

<script>

/* STATE */
let data = JSON.parse(localStorage.getItem("planner")) || {
  tasks:[],
  sections:[]
};

/* SAVE */
function save(){
  localStorage.setItem("planner", JSON.stringify(data));
}

/* NAV */
function show(page){
  ["home","tasks","pomodoro","settings"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(page).style.display="block";
  render();
}

/* MENU */
function toggleMenu(){
  let m=document.getElementById("menu");
  m.style.display = m.style.display=="block"?"none":"block";
}

/* ADD */
function addTask(){
  let t=prompt("Task name");
  let d=prompt("Due date (YYYY-MM-DD)");

  data.tasks.push({text:t,date:d,done:false});
  save();
  render();
}

function addSection(){
  let s=prompt("Section name");
  data.sections.push({name:s,open:true});
  save();
  render();
}

/* RENDER TASKS */
function render(){
  let el=document.getElementById("tasks");
  el.innerHTML="";

  data.sections.forEach((s,i)=>{
    let sec=document.createElement("div");
    sec.className="section";

    let head=document.createElement("div");
    head.className="section-header";
    head.innerText=s.name;
    head.onclick=()=>{s.open=!s.open;save();render();};

    sec.appendChild(head);

    if(s.open){
      data.tasks.forEach((t)=>{
        let div=document.createElement("div");
        div.className="task";
        div.innerHTML=`${t.text} <small>${t.date||""}</small>`;
        sec.appendChild(div);
      });
    }

    el.appendChild(sec);
  });
}

/* BACKGROUNDS */
function setBg(type){
  let url={
    tokyo:"https://images.unsplash.com/photo-1505060895624-73cc6d3c8c6e",
    cafe:"https://images.unsplash.com/photo-1509042239860-f550ce710b93",
    garden:"https://images.unsplash.com/photo-1466692476868-aef1dfb1e735"
  }[type];

  document.body.style.setProperty('--bg',url);
  document.body.style.backgroundImage=`url(${url})`;
}

/* ACCENT */
function setAccent(c){
  document.documentElement.style.setProperty("--accent",c);
}

/* POMODORO */
let time=1500;
let int;

function start(){
  int=setInterval(()=>{
    time--;
    let m=Math.floor(time/60);
    let s=time%60;
    document.getElementById("timer").innerText=
      `${m}:${s<10?"0":""}${s}`;
  },1000);
}

function reset(){
  clearInterval(int);
  time=1500;
}

/* INIT */
render();

</script>

</body>
</html>
