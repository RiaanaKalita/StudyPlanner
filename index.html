<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aesthetic Planner</title>

<style>
:root{
  --bg:#fff0f5;
  --card:#ffffff;
  --text:#444;
  --accent:#ff8fab;
}

body{
  margin:0;
  font-family: "Segoe UI", sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:var(--card);
}

button{
  border:none;
  padding:6px 10px;
  margin:3px;
  border-radius:8px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

.page{display:none; padding:15px;}
.active{display:block;}

.card{
  background:var(--card);
  padding:12px;
  border-radius:12px;
  margin:10px 0;
}

/* themes */
.pink{--bg:#fff0f5; --accent:#ff8fab;}
.beige{--bg:#f5ebe0; --accent:#d4a373;}
.blue{--bg:#eef6ff; --accent:#7aa6ff;}
.dark{--bg:#1e1e1e; --card:#2c2c2c; --text:#eee; --accent:#888;}
</style>
</head>

<body>

<header>
<div>
<button onclick="nav('home')">🏠</button>
<button onclick="nav('todo')">✅</button>
<button onclick="nav('calendar')">📅</button>
<button onclick="nav('pomodoro')">⏱</button>
<button onclick="nav('notes')">📓</button>
</div>

<div>
<button onclick="theme('pink')">🌸</button>
<button onclick="theme('beige')">🤍</button>
<button onclick="theme('blue')">🌊</button>
<button onclick="theme('dark')">🌙</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="page active">
<div class="card">
<h2 id="date"></h2>
<p id="quote"></p>
</div>
</div>

<!-- TODO -->
<div id="todo" class="page">
<div class="card">
<input id="listName" placeholder="New List (e.g. Math)">
<button onclick="addList()">Add List</button>
<div id="lists"></div>
</div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="page">
<div class="card">
<div id="cal"></div>
<div id="calTasks"></div>
</div>
</div>

<!-- POMODORO -->
<div id="pomodoro" class="page">
<div class="card">
<input id="focus" type="number" value="25"> Focus
<input id="break" type="number" value="5"> Break
<div id="timer">25:00</div>
<button onclick="start()">Start</button>
<button onclick="reset()">Reset</button>
</div>
</div>

<!-- NOTES -->
<div id="notes" class="page">
<div class="card">
<input id="noteTitle" placeholder="Title">
<textarea id="noteText"></textarea>
<button onclick="saveNote()">Save</button>
<div id="noteList"></div>
</div>
</div>

<script>

/* NAV */
function nav(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* THEME */
function theme(t){ document.body.className=t; }

/* HOME */
const quotes=[
"You’re doing amazing 🌸",
"Small steps still count 🤍",
"Stay consistent, not perfect ✨"
];
date.innerText=new Date().toDateString();
quote.innerText=quotes[Math.floor(Math.random()*quotes.length)];

/* STORAGE */
let data=JSON.parse(localStorage.getItem("planner")||"{}");
if(!data.lists)data.lists=[];
if(!data.notes)data.notes=[];

/* TODO LIST */
function addList(){
let name=listName.value;
data.lists.push({name,tasks:[]});
save();
renderLists();
}

function addTask(i){
let text=prompt("Task?");
let date=prompt("Due date YYYY-MM-DD?");
data.lists[i].tasks.push({text,date,done:false});
save();
renderLists();
}

function toggleTask(i,j){
data.lists[i].tasks[j].done=!data.lists[i].tasks[j].done;
save(); renderLists();
}

function renderLists(){
lists.innerHTML="";
data.lists.forEach((l,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${l.name}</h3>
<button onclick="addTask(${i})">+ Task</button>`;
l.tasks.forEach((t,j)=>{
let task=document.createElement("div");
task.innerHTML=`
<span style="text-decoration:${t.done?'line-through':'none'}">${t.text} (${t.date})</span>
<button onclick="toggleTask(${i},${j})">✔</button>`;
div.appendChild(task);
});
lists.appendChild(div);
});
}
renderLists();

/* CALENDAR */
for(let i=1;i<=30;i++){
let d=document.createElement("button");
d.innerText=i;
d.onclick=()=>{
let day=String(i).padStart(2,"0");
let tasks=[];
data.lists.forEach(l=>{
l.tasks.forEach(t=>{
if(t.date && t.date.endsWith("-"+day)) tasks.push(t.text);
});
});
calTasks.innerText=tasks.join(", ") || "No tasks";
};
cal.appendChild(d);
}

/* POMODORO */
let interval, time=1500;

function start(){
clearInterval(interval);
time=focus.value*60;
interval=setInterval(()=>{
if(time>0){
time--;
let m=Math.floor(time/60);
let s=time%60;
timer.innerText=`${m}:${s<10?'0':''}${s}`;
}
},1000);
}

function reset(){
clearInterval(interval);
timer.innerText="00:00";
}

/* NOTES */
function saveNote(){
data.notes.push({title:noteTitle.value,text:noteText.value});
save(); renderNotes();
}

function renderNotes(){
noteList.innerHTML="";
data.notes.forEach((n,i)=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`⭐ <b>${n.title}</b><p>${n.text}</p>`;
noteList.appendChild(div);
});
}
renderNotes();

/* SAVE */
function save(){
localStorage.setItem("planner",JSON.stringify(data));
}

</script>

</body>
</html>
