<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aesthetic Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

:root{
  --accent:#f5c6d6;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  color:white;
  overflow:hidden;
}

/* 🌄 BACKGROUND */
#bg{
  position:fixed;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  z-index:-1;
  transition:1s ease;
  filter:brightness(0.85);
}

/* 🌸 SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  height:100%;
  width:180px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  padding:30px 20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.logo{
  font-family:'Playfair Display';
  font-size:22px;
  margin-bottom:20px;
}

.tab{
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.tab:hover{
  background:rgba(255,255,255,0.15);
}

.active{
  background:var(--accent);
  color:black;
}

/* 🪟 MAIN */
.main{
  margin-left:200px;
  padding:30px;
  height:100vh;
  overflow-y:auto;
}

/* ✨ CARDS */
.card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  padding:25px;
  border-radius:20px;
  margin-bottom:20px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-3px);
}

/* 🏠 HOME */
.title{
  font-family:'Playfair Display';
  font-size:36px;
}

.quote{
  margin-top:10px;
  opacity:0.8;
  font-style:italic;
}

/* 📋 TASK */
.task{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

.task input{
  margin-right:10px;
}

.completed{
  text-decoration:line-through;
  opacity:0.5;
}

/* ➕ BUTTON */
.addBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  border:none;
  font-size:30px;
  background:var(--accent);
  color:black;
  cursor:pointer;
  transition:0.3s;
}

.addBtn:hover{
  transform:scale(1.1);
}

/* POPUP */
.popup{
  position:fixed;
  bottom:100px;
  right:25px;
  background:white;
  color:black;
  padding:15px;
  border-radius:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
  animation:fade 0.3s;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px)}
  to{opacity:1}
}

/* 🍅 POMODORO */
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
  flex-direction:column;
}

.timer{
  font-size:90px;
  font-family:'Playfair Display';
}

/* ⚙ SETTINGS */
.settings input{
  width:100%;
}

/* 📓 NOTES */
.note{
  background:white;
  color:black;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

</style>
</head>

<body>

<div id="bg"></div>

<!-- 🌸 SIDEBAR -->
<div class="sidebar">
  <div class="logo">Planner</div>

  <div class="tab active" onclick="switchTab('home',this)">Home</div>
  <div class="tab" onclick="switchTab('tasks',this)">Tasks</div>
  <div class="tab" onclick="switchTab('pomodoro',this)">Pomodoro</div>
  <div class="tab" onclick="switchTab('notes',this)">Notes</div>
  <div class="tab" onclick="switchTab('settings',this)">Settings</div>
</div>

<!-- 🪟 MAIN -->
<div class="main">

<!-- HOME -->
<div id="home">
  <div class="card">
    <div class="title" id="date"></div>
    <div class="quote">“Small progress is still progress.” 🌷</div>
  </div>

  <div class="card">
    <h3>Today’s Tasks</h3>
    <div id="preview"></div>
  </div>
</div>

<!-- TASKS -->
<div id="tasks" style="display:none">
  <div class="card">
    <h2>To Do</h2>
    <div id="taskList"></div>
  </div>
</div>

<!-- POMODORO -->
<div id="pomodoro" style="display:none">
  <div class="center">
    <div class="timer" id="timer">25:00</div>
    <button onclick="start()">Start</button>
    <button onclick="reset()">Reset</button>
  </div>
</div>

<!-- NOTES -->
<div id="notes" style="display:none">
  <div class="card">
    <h2>Notebook</h2>
    <button onclick="addNote()">Add Page</button>
    <div id="notesList"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" style="display:none">
  <div class="card settings">
    <h2>Settings</h2>

    <label>Accent Color</label>
    <input type="color" onchange="setColor(this.value)">

    <label>Upload Background</label>
    <input type="file" accept="image/*" onchange="uploadBg(event)">

    <button onclick="setBg(0)">Cafe</button>
    <button onclick="setBg(1)">Beach</button>
    <button onclick="setBg(2)">City</button>
  </div>
</div>

</div>

<button class="addBtn" onclick="openMenu()">+</button>
<div id="menu"></div>

<script>

/* 🌄 BACKGROUNDS */
let bgs=[
"https://images.unsplash.com/photo-1492724441997-5dc865305da7",
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
"https://images.unsplash.com/photo-1512453979798-5ea266f8880c"
];

function setBg(i){
  bg.style.backgroundImage=`url(${bgs[i]})`;
  localStorage.setItem("bg",i);
}

let saved=localStorage.getItem("bg")||0;
setBg(saved);

function uploadBg(e){
 let file=e.target.files[0];
 let reader=new FileReader();
 reader.onload=(x)=>{
   bg.style.backgroundImage=`url(${x.target.result})`;
   localStorage.setItem("customBg",x.target.result);
 }
 reader.readAsDataURL(file);
}

let custom=localStorage.getItem("customBg");
if(custom){bg.style.backgroundImage=`url(${custom})`}

/* 🎨 COLOR */
function setColor(c){
 document.documentElement.style.setProperty("--accent",c);
 localStorage.setItem("color",c);
}
let savedColor=localStorage.getItem("color");
if(savedColor) setColor(savedColor);

/* 📅 DATE */
date.innerText=new Date().toDateString();

/* 🧭 NAV */
function switchTab(id,el){
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");

 document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");
 document.getElementById(id).style.display="block";
}

/* 📋 TASKS */
let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

function save(){
 localStorage.setItem("tasks",JSON.stringify(tasks));
}

function render(){
 taskList.innerHTML="";
 preview.innerHTML="";

 tasks.forEach((t,i)=>{
  let div=document.createElement("div");
  div.className="task"+(t.done?" completed":"");

  div.innerHTML=`
  <div>
    <input type="checkbox" ${t.done?"checked":""} onclick="toggle(${i})">
    ${t.text} <small>${t.date||""}</small>
  </div>
  <button onclick="del(${i})">x</button>`;

  taskList.appendChild(div);

  if(!t.done){
    preview.innerHTML+=`<div>${t.text}</div>`;
  }
 });
}
render();

function addTask(){
 tasks.push({
  text:text.value,
  date:due.value,
  done:false
 });
 save(); render();
 menu.innerHTML="";
}

function toggle(i){
 tasks[i].done=!tasks[i].done;
 save(); render();
}

function del(i){
 tasks.splice(i,1);
 save(); render();
}

/* ➕ MENU */
function openMenu(){
 menu.innerHTML=`
 <div class="popup">
   <input id="text" placeholder="Task">
   <input type="date" id="due">
   <button onclick="addTask()">Add</button>
 </div>`;
}

/* 🍅 TIMER */
let time=1500, int;

function start(){
 if(int) return;
 int=setInterval(()=>{
  time--;
  update();
 },1000);
}

function reset(){
 clearInterval(int);
 time=1500;
 update();
}

function update(){
 let m=Math.floor(time/60);
 let s=time%60;
 timer.innerText=`${m}:${s<10?"0":""}${s}`;
}

/* 📓 NOTES */
let notes=JSON.parse(localStorage.getItem("notes"))||[];

function addNote(){
 notes.push("");
 saveNotes(); renderNotes();
}

function renderNotes(){
 notesList.innerHTML="";
 notes.forEach((n,i)=>{
  notesList.innerHTML+=`
  <textarea class="note" oninput="editNote(${i},this.value)">${n}</textarea>`;
 });
}
renderNotes();

function editNote(i,val){
 notes[i]=val;
 saveNotes();
}

function saveNotes(){
 localStorage.setItem("notes",JSON.stringify(notes));
}

</script>

</body>
</html>
